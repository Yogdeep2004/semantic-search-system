<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 65" width="800" height="65" role="img" aria-label="Query pipeline: embed with MiniLM, route to a fuzzy c-means cluster, check the cluster-partitioned semantic cache, recall with BM25, re-rank with dense similarity."><title>Query pipeline: embed with MiniLM, route to a fuzzy c-means cluster, check the cluster-partitioned semantic cache, recall with BM25, re-rank with dense similarity.</title><style>
